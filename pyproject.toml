[project]
name = "sam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "YusufCaymazZ", email = "yuscaymaz@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "hydra-core>=1.3.8",
    "iopath>=0.1.10",
    "matplotlib>=3.11.2",
    "opencv-python>=5.0.0.93",
    "tqdm>=4.70.1",
    "transformers>=5.22.1",
]

[dependency-groups]
demo = [
    "numpy>=2.2",
    "opencv-python>=4.10",
]
test = [
    "numpy>=2.2",
    "opencv-python-headless>=4.10",
    "pytest>=8.3",
]

[project.scripts]
sam = "sam:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
